<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unfolding Letters</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--b1:#3b2114;--b2:#120804;--gold:#e7bf6a}
[data-t=midnight]{--b1:#1c2a4a;--b2:#070b17}
[data-t=wine]{--b1:#52182a;--b2:#14040a}
[data-t=forest]{--b1:#1f3d2d;--b2:#07130c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fbefdc;font:19px/1.5 'Cormorant Garamond',serif;background:radial-gradient(ellipse at 50% 0,var(--b1),var(--b2) 75%) fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
header{display:flex;gap:1rem;align-items:center;padding:.8rem 1.4rem}
header h1{flex:1;margin:0;font-size:1.5rem;letter-spacing:.04em}
select,input{font:inherit;color:inherit;background:#0004;border:1px solid #fff3;border-radius:8px;padding:.3rem .6rem}
option{color:#000}
main{max-width:820px;margin:auto;padding:0 1rem 3rem;text-align:center}
.btn{background:var(--gold);color:#2a1308;border-radius:99px;padding:.4rem 1.2rem;font-weight:700}
.auth{max-width:340px;margin:18vh auto;display:grid;gap:.8rem;text-align:center}
.cap{opacity:.85;margin:1rem 0 0}
/* ---------- the box ---------- */
.wood{background:repeating-linear-gradient(90deg,#0000 0 5px,#0001 5px 6px,#fff1 6px 7px,#0000 7px 14px),linear-gradient(#7d4727,#5b2f17 60%,#47220f);box-shadow:inset 0 0 0 2px #d79e6c55,inset 0 0 26px #000b,0 10px 24px #000a;border-radius:10px}
.scn{position:relative;width:min(92vw,600px);aspect-ratio:1/.9;margin:22% auto 5rem;perspective:1100px;text-align:left}
.tray{position:absolute;inset:0 0 34% 0;z-index:1}
.well{position:absolute;inset:7% 5% 0;background:linear-gradient(#000a,#0000 45%),#26100a;box-shadow:inset 0 0 24px #000;border-radius:4px 4px 0 0;overflow:hidden;display:flex;gap:2.5%;align-items:flex-end;padding:5% 4% 0}
.lid{position:absolute;left:0;right:0;top:0;height:66%;z-index:2;transform-style:preserve-3d;transform-origin:50% 0;transition:transform 1.7s cubic-bezier(.3,1.15,.4,1)}
.open .lid{transform:rotateX(112deg)}
.lf,.lb{position:absolute;inset:0;backface-visibility:hidden}
.lb{transform:rotateX(180deg);filter:brightness(.55)}
.lip{position:absolute;left:0;right:0;top:60%;height:40%;z-index:3}
.carve{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1.5px 0 #d9a06a99)}
.lip .carve{inset:14% 4% 12%;width:92%;height:74%}
.pn{position:absolute;inset:17% 9%;background:linear-gradient(#0003,#0000 30%),#6a3719;box-shadow:inset 0 3px 10px #000c,0 1px 0 #e0a86f88;border-radius:6px;display:grid;place-items:center;padding:0 6%}
.pn h2{margin:0;text-align:center;font-size:clamp(1.1rem,4.7vw,2rem);line-height:1.2;color:#3a1b0a;text-shadow:0 1px 0 #c58a58,0 -1px 0 #0006}
.plate{position:absolute;left:50%;top:8%;width:16%;transform:translateX(-50%);filter:drop-shadow(0 3px 4px #000a);transition:filter .4s}
.unl .plate{filter:drop-shadow(0 0 14px #ffe08a)}
.vol{position:relative;flex:1;height:94%;border-radius:6px 6px 2px 2px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9% 0;
 background:radial-gradient(#fff1 1px,#0000 1.5px) 0 0/5px 5px,linear-gradient(90deg,#2f1006,#7c3519 28%,#8d4422 50%,#5c240f 78%,#2a0e05);
 box-shadow:inset 0 0 14px #000b,2px 0 6px #000a;transform:translateY(60%);transition:transform .9s cubic-bezier(.2,.9,.3,1.1) calc(1.1s + var(--i)*.13s)}
.open .vol{transform:none}.still .vol,.still .lid{transition:none}
.scn:not(.open) .vol{pointer-events:none}
.vol:hover{filter:brightness(1.25)}
.bd{position:absolute;inset:4%;border:1.5px solid #a07a30;outline:1px solid #a07a3099;outline-offset:-6px;border-radius:3px;animation:bdg 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.55s)}
.vol::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(112deg,#0000 38%,#fff0b9aa 50%,#0000 62%) 160% 0/260% 100%;animation:sw 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.55s)}
@keyframes sw{0%,35%{background-position:160% 0}75%,100%{background-position:-60% 0}}
@keyframes bdg{0%,25%,85%,100%{border-color:#a07a30;outline-color:#a07a3099}50%{border-color:#fff0b5;outline-color:#ffe08a;box-shadow:0 0 8px #ffe08a88}}
.vol b{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--gold);font-size:clamp(.8rem,3.3vw,1.25rem);letter-spacing:.18em;text-shadow:0 1px 2px #000}
.fz{width:60%;height:auto;aspect-ratio:40/24;fill:var(--gold);position:relative}
.vol i{position:absolute;top:3px;right:4px;background:var(--gold);color:#2a1308;border-radius:99px;font:700 .75rem sans-serif;padding:1px 6px;z-index:2}
.key{position:absolute;width:38%;left:58%;top:104%;z-index:5;transform-origin:6% 50%;transition:left 1.1s cubic-bezier(.5,0,.2,1),top 1.1s cubic-bezier(.5,0,.2,1),opacity .9s}
.key svg{display:block;width:100%;transform-origin:6% 50%;transition:transform .6s;animation:sway 2.6s ease-in-out infinite,kg 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(5deg) translateY(-5px)}}
@keyframes kg{50%{filter:drop-shadow(0 0 10px #ffe08a)}}
.key.ins{left:47.8%;top:66.3%}.key.ins svg{animation:none;transform:none}
.key.turn svg{transform:rotate(-40deg)}.key.gone{opacity:0}
/* ---------- letters grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.8rem 1.2rem;margin:1.5rem 0}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.mt{display:block;text-align:center}.mt em{display:block;margin-top:.5rem;font-size:1rem;line-height:1.2}
.mt:not(.empty):hover .mini{transform:translateY(-4px)}
.mini{position:relative;aspect-ratio:1.35;background:linear-gradient(#e0b070,#c48a45);border-radius:3px;box-shadow:0 8px 14px #0008;transition:transform .25s}
.mini::before{content:'';position:absolute;inset:0;background:#cf9650;clip-path:polygon(0 0,100% 0,50% 56%)}
.mini::after{content:'';position:absolute;inset:0;background:linear-gradient(to top right,#0000 49.6%,#0003 50%,#0000 50.6%) left/50% 100% no-repeat,linear-gradient(to top left,#0000 49.6%,#0003 50%,#0000 50.6%) right/50% 100% no-repeat}
.tw2{position:absolute;left:0;right:0;top:51%;height:4px;background:#8a6a38;z-index:1}
.sl{position:absolute;left:50%;top:54%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#c42a4b,#6e1026 65%);box-shadow:inset 0 0 0 3px #0003,0 2px 4px #0006;z-index:2}
.rd .mini{filter:saturate(.45) brightness(.85)}.rd em::after{content:' ✓'}
.empty{opacity:.3}
.pager{display:flex;justify-content:center;align-items:center;gap:.7rem}
.dot{width:11px;height:11px;border-radius:50%;background:#fff4}.dot.on{background:var(--gold)}
/* ---------- opening a letter ---------- */
.ov{position:fixed;inset:0;background:#000d;z-index:50;display:flex;padding:1rem;overflow:auto}
.wrap{margin:auto;text-align:center}
.E{position:relative;width:min(90vw,520px);aspect-ratio:1.35;perspective:900px}
.eb{position:absolute;inset:0;background:radial-gradient(#0001 1px,#0000 1.5px) 0 0/4px 4px,linear-gradient(#dfae6b,#c28744);box-shadow:0 14px 30px #000a;border-radius:4px}
.eb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top right,#0000 49.7%,#0003 50%,#0000 50.5%) left/50% 100% no-repeat,linear-gradient(to top left,#0000 49.7%,#0003 50%,#0000 50.5%) right/50% 100% no-repeat}
.ef{position:absolute;inset:0;background:linear-gradient(#d19a55,#c38a46);clip-path:polygon(0 0,100% 0,50% 56%);transform-origin:50% 0;filter:drop-shadow(0 4px 3px #0006)}
.go .ef{transform:rotateX(180deg);transition:transform .9s .6s}
.stems{position:absolute;inset:0;width:100%;height:100%}
.stems line{stroke:#7f8c4c;stroke-width:.25}.go .stems{opacity:0;transition:opacity .9s}
.f{position:absolute;transform:translate(-50%,-50%);font-style:normal;font-size:clamp(9px,2.7vw,17px);line-height:1;transition:transform 1.9s cubic-bezier(.2,.7,.3,1) calc(var(--d)*1ms),opacity 1.9s ease-in calc(var(--d)*1ms)}
.go .f{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}
.tw{position:absolute;top:53.5%;height:8%;width:40%;background:repeating-linear-gradient(100deg,#0003 0 2px,#0000 2px 5px),linear-gradient(#0000 0 8%,#b48a4d 8% 28%,#0000 28% 36%,#caa365 36% 56%,#0000 56% 64%,#b48a4d 64% 84%,#0000 84%);z-index:3}
.tw.l{left:0}.tw.r{right:0}
.go .tw{transition:transform 1s,opacity 1s;opacity:0}.go .tw.l{transform:translate(-40px,60px) rotate(-16deg)}.go .tw.r{transform:translate(40px,60px) rotate(16deg)}
.sealb{position:absolute;left:50%;top:56%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{filter:drop-shadow(0 0 14px #ffd27a)}}
.go .sealb{animation:none}
.sh{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c42a4b,#7a1229 55%,#4a0818);box-shadow:inset 0 0 0 4px #0003,inset 0 0 0 7px #ffffff1c;display:grid;place-items:center;text-align:center;font:500 clamp(.7rem,2.6vw,1.15rem)/1 Caveat,cursive;color:#f6bcc4;text-shadow:0 1px 1px #000a;transition:transform 1s,opacity 1s}
.sh.a{clip-path:polygon(0 0,52% 0,46% 35%,54% 60%,48% 100%,0 100%)}
.sh.b{clip-path:polygon(52% 0,100% 0,100% 100%,48% 100%,54% 60%,46% 35%)}
.go .a{transform:translate(-55px,45px) rotate(-28deg);opacity:0}.go .b{transform:translate(55px,55px) rotate(28deg);opacity:0}
.hint{margin-top:1rem}.go+.hint{visibility:hidden}
.lt{width:min(94vw,640px);min-height:min(66vw,430px);padding:13% 13%;background-size:100% 100%;color:#3a2230;font-family:Caveat,cursive;line-height:1.35;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5rem;animation:rise .9s both}
@keyframes rise{from{transform:translateY(50px) scale(.85);opacity:0}}
.lt img{max-width:80%;max-height:220px;border:6px solid #fff;box-shadow:0 3px 8px #0004;transform:rotate(-2deg)}
.lt .tx{white-space:pre-wrap}.lt .st{font-size:1.8rem}
.wrap .btn{margin-top:1rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body data-t="walnut"><div id="app"></div>

<svg width="0" height="0" style="position:absolute"><defs>
<g id="fl"><ellipse rx="2.4" ry="8"/><ellipse rx="2.4" ry="8" transform="rotate(60)"/><ellipse rx="2.4" ry="8" transform="rotate(120)"/></g>
<pattern id="vn" width="64" height="36" patternUnits="userSpaceOnUse"><g fill="#2a1308" stroke="#2a1308"><path d="M0 18C10 2 24 2 32 18S54 34 64 18" fill="none" stroke-width="2.6"/><use href="#fl" x="32" y="18" stroke="none"/><circle cx="14" cy="8" r="2" stroke="none"/><circle cx="50" cy="28" r="2" stroke="none"/></g></pattern>
<symbol id="fz" viewBox="0 0 40 24"><path d="M20 1C23 7 30 10 39 12 30 14 23 17 20 23 17 17 10 14 1 12 10 10 17 7 20 1Z"/></symbol>
<linearGradient id="br" x2="1" y2="1"><stop offset="0" stop-color="#f3dc8e"/><stop offset=".5" stop-color="#b98a2c"/><stop offset="1" stop-color="#6e4d12"/></linearGradient>
<linearGradient id="kg" x2="0" y2="1"><stop offset="0" stop-color="#f6e2a0"/><stop offset=".5" stop-color="#c4962f"/><stop offset="1" stop-color="#7d5a16"/></linearGradient>
</defs></svg>

<script src="letters.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=window.SETTINGS,L=window.LETTERS,THEMES=['walnut','midnight','wine','forest'];
let vol=null,page=0,unlocked=false,read={};
try{read=JSON.parse(localStorage.read||'{}')}catch(e){}
document.title=S.siteTitle;document.body.dataset.t=localStorage.theme||'walnut';
const isRead=l=>read[l.vol+'-'+l.slot];
const band=c=>`<svg class="carve ${c}"><rect width="100%" height="100%" fill="url(#vn)"/></svg>`;
const PLATE=`<svg viewBox="0 0 60 80"><path d="M30 2C40 8 54 8 58 14L56 52C54 66 40 76 30 78 20 76 6 66 4 52L2 14C6 8 20 8 30 2Z" fill="url(#br)" stroke="#5a3d10" stroke-width="1.5"/><circle cx="30" cy="34" r="6" fill="#1a0d05"/><path d="M27 38h6l2 16h-10z" fill="#1a0d05"/><circle cx="12" cy="16" r="2" fill="#5a3d10"/><circle cx="48" cy="16" r="2" fill="#5a3d10"/></svg>`;
const KEY=`<svg viewBox="0 0 240 80"><g fill="url(#kg)" stroke="#4a3208" stroke-width="1"><rect x="14" y="36" width="150" height="8" rx="3"/><path d="M14 44h34v13h-8v-6h-6v8h-8v-6h-6z"/><rect x="112" y="31" width="8" height="18" rx="2"/><rect x="128" y="33" width="6" height="14" rx="2"/><circle cx="192" cy="40" r="25" fill="none" stroke="url(#kg)" stroke-width="7"/><circle cx="192" cy="40" r="15" fill="none" stroke-width="3"/><circle cx="192" cy="40" r="5"/><circle cx="192" cy="22" r="5"/><circle cx="192" cy="58" r="5"/><circle cx="174" cy="40" r="5"/><circle cx="210" cy="40" r="5"/></g><path d="M214 24C228 10 238 26 228 36" stroke="#6b3a22" stroke-width="3" fill="none"/><path d="M223 36h10l4 34h-18z" fill="#5a2a18"/><rect x="222" y="34" width="12" height="5" fill="#3a1a0e"/></svg>`;

function gate(){app.innerHTML=`<div class="auth"><h1>${esc(S.siteTitle)}</h1><p>Enter the passcode</p><input id=pc type=password><button class=btn id=go>Open</button></div>`;
 $('#go').onclick=()=>{if($('#pc').value===S.passcode){sessionStorage.ok=1;render()}else{$('#pc').value='';$('#pc').placeholder='Try again'}}}

function render(){
 if(S.passcode&&!sessionStorage.ok)return gate();
 const un=L.filter(l=>!isRead(l)).length;
 app.innerHTML=`<header><h1>${esc(S.siteTitle)}</h1><span>${un?un+' unread':'All read'}</span><select id=th>${THEMES.map(t=>`<option ${document.body.dataset.t==t?'selected':''}>${t}</option>`).join('')}</select></header><main id=m></main>`;
 $('#th').onchange=e=>{document.body.dataset.t=localStorage.theme=e.target.value};
 vol===null?boxView($('#m')):volView($('#m'))}

function boxView(m){
 const o=unlocked;
 const books=[1,2,3,4,5].map(n=>{const c=L.filter(l=>l.vol==n&&!isRead(l)).length;
  return `<button class=vol style="--i:${n-1}" data-v=${n} aria-label="Volume ${n}"><span class=bd></span><svg class=fz><use href="#fz"/></svg><b>VOLUME ${n}</b><svg class=fz><use href="#fz"/></svg>${c?`<i>${c}</i>`:''}</button>`}).join('');
 m.innerHTML=`<p class=cap id=cap>${o?'Choose a volume to begin.':'Touch the key to unlock the box.'}</p>
 <div class="scn ${o?'open still':''}" id=sc><div class="tray wood"><div class=well>${books}</div></div>
 <div class=lid><div class="lf wood">${band('')}<div class=pn><h2>Unfolding Letters for Emotional Reconciliation</h2></div></div><div class="lb wood"></div></div>
 <div class="lip wood">${band('')}<div class=plate>${PLATE}</div></div>${o?'':`<button class=key id=ky aria-label="Unlock the box">${KEY}</button>`}</div>`;
 document.querySelectorAll('.vol').forEach(b=>b.onclick=()=>{vol=+b.dataset.v;page=0;render()});
 const ky=$('#ky');if(ky)ky.onclick=()=>{const k=ky,sc=$('#sc');k.onclick=null;
  k.classList.add('ins');setTimeout(()=>{k.classList.add('turn');sc.classList.add('unl')},1200);
  setTimeout(()=>{k.classList.add('gone');sc.classList.add('open')},1900);
  setTimeout(()=>{unlocked=true;$('#cap').textContent='Choose a volume to begin.';k.remove()},4200)}}

function volView(m){
 const tiles=[0,1,2,3].map(i=>{const s=page*4+i+1,l=L.find(x=>x.vol==vol&&x.slot==s);
  return l?`<button class="mt ${isRead(l)?'rd':''}" data-s=${s}><div class=mini><span class=tw2></span><span class=sl></span></div><em>${esc(l.title)}</em></button>`
  :`<div class="mt empty"><div class=mini></div><em>Letter ${s} is not written yet</em></div>`}).join('');
 m.innerHTML=`<p><button class=btn id=bk>Back to the box</button></p><h2>Volume ${vol} · page ${page+1} of 5</h2><div class=grid id=gr>${tiles}</div>
 <div class=pager><button class=btn id=pv>‹</button>${[0,1,2,3,4].map(i=>`<button class="dot ${i==page?'on':''}" data-p=${i} aria-label="Page ${i+1}"></button>`).join('')}<button class=btn id=nx>›</button></div>`;
 $('#bk').onclick=()=>{vol=null;render()};
 const go=p=>{page=Math.max(0,Math.min(4,p));render()};
 $('#pv').onclick=()=>go(page-1);$('#nx').onclick=()=>go(page+1);
 document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.p));
 let sx;const g=$('#gr');g.ontouchstart=e=>sx=e.touches[0].clientX;g.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(page+(d<0?1:-1))};
 document.querySelectorAll('.mt[data-s]').forEach(t=>t.onclick=()=>openLetter(L.find(l=>l.vol==vol&&l.slot==+t.dataset.s)))}

function img(u){return u&&/^(https:\/\/|assets\/)/.test(u)?`<img src="${esc(u)}" alt="">`:''}
function openLetter(l){
 const cols=['#e98ab3','#f2b6cf','#a07ad8','#c9b0ef','#fff1d6','#ffffff'];let fl='',st='';
 for(let i=0;i<110;i++){const a=(Math.random()*150-75)*Math.PI/180,r=6+Math.random()*34,x=50+Math.sin(a)*r,y=57-Math.cos(a)*r/.74;
  st+=`<line x1="50" y1="42" x2="${x}" y2="${y*.74}"/>`;
  fl+=`<i class=f style="left:${x}%;top:${y}%;color:${cols[i%6]};--dx:${Math.sin(a)*(150+Math.random()*250)}px;--dy:${100+Math.random()*320}px;--r:${Math.random()*540-270}deg;--d:${Math.random()*300}">✿</i>`}
 const ov=document.createElement('div');ov.className='ov';
 const half=c=>`<div class="sh ${c}">Unveiling<br>Emotions</div>`;
 ov.innerHTML=`<div class=wrap><div class=E id=E><div class=eb></div><div class=ef></div><svg class=stems viewBox="0 0 100 74" preserveAspectRatio="none">${st}</svg>${fl}<div class="tw l"></div><div class="tw r"></div><button class=sealb aria-label="Break the seal">${half('a')}${half('b')}</button></div><div class=hint>Tap the seal to break it</div></div>`;
 document.body.append(ov);
 ov.querySelector('.sealb').onclick=()=>{
  $('#E').classList.add('go');read[l.vol+'-'+l.slot]=1;localStorage.read=JSON.stringify(read);
  setTimeout(()=>{const c={pink:'Pink',purple:'Purple',white:'White'}[l.card]||'White',n=(l.text||'').length,fs=n<250?'1.9rem':n<600?'1.55rem':'1.3rem';
   ov.innerHTML=`<div class=wrap><div class=lt style="background-image:url(assets/${c}_Card.png);font-size:${fs}"><div class=tx>${esc(l.text)}</div><div class=st>${(l.stickers||[]).map(esc).join(' ')}</div>${img(l.photo)}${img(l.gif)}<div>— ${esc(S.from)}</div></div><button class=btn id=back>Back to Volume ${l.vol}</button></div>`;
   $('#back').onclick=()=>{ov.remove();render()}},2000)}}
render();
</script></body></html>
