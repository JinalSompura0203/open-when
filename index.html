<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unfolding Letters</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1a14;--bg2:#5a3626;--ac:#e8b4b8;--gold:#f5d98a;--tx:#fff4ea}
[data-t=lavender]{--bg:#1d1530;--bg2:#44306b;--ac:#c9a7f0;--gold:#efe0ff}
[data-t=sage]{--bg:#12231b;--bg2:#2f5340;--ac:#a8d5b5;--gold:#f3e7b0}
[data-t=rose]{--bg:#3a1320;--bg2:#7a2e44;--ac:#ffb3c6;--gold:#ffd9a0}
[data-t=midnight]{--bg:#0b1224;--bg2:#1f3560;--ac:#9ec5ff;--gold:#ffe9a8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:18px/1.5 'Cormorant Garamond',serif;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.8rem 1.2rem;background:#0004}
header h1{margin:0;font-size:1.5rem;flex:1}
.btn{background:var(--ac);color:#2a1a14;border:0;border-radius:99px;padding:.45rem 1.1rem;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ac)}
select,input,textarea{background:#fff1;border:1px solid #fff4;border-radius:10px;padding:.5rem .7rem;width:100%}
option{color:#000}
.seg{display:flex;gap:0;border:1px solid var(--ac);border-radius:99px;overflow:hidden}
.seg button{background:none;border:0;padding:.35rem 1rem}.seg .on{background:var(--ac);color:#2a1a14;font-weight:700}
main{max-width:900px;margin:auto;padding:1.2rem}
.panel{background:#0003;border:1px solid #fff2;border-radius:18px;padding:1.2rem;margin-bottom:1rem}
.auth{max-width:380px;margin:12vh auto;display:grid;gap:.7rem;text-align:center}
.bell{position:relative;background:none;border:0;font-size:1.4rem}
.bell b{position:absolute;top:-4px;right:-6px;background:#e0455f;color:#fff;border-radius:99px;font-size:.7rem;padding:0 .35rem}
#toast{position:fixed;top:14px;right:14px;z-index:99;display:grid;gap:8px}
#toast div{background:var(--gold);color:#2a1a14;padding:.6rem 1rem;border-radius:12px;animation:pop .4s}
@keyframes pop{from{transform:translateX(60px);opacity:0}}
/* box scene */
.scene{position:relative;max-width:560px;margin:auto;aspect-ratio:1402/1122}
.scene img{width:100%;height:100%;object-fit:contain;display:block}
.keyhint{position:absolute;left:50%;top:56%;font-size:2.6rem;transform-origin:50% 0;animation:swing 2.2s ease-in-out infinite;background:none;border:0;filter:drop-shadow(0 0 10px var(--gold))}
@keyframes swing{50%{transform:rotate(18deg) translateY(6px)}0%,100%{transform:rotate(-14deg)}}
.unlock{animation:shake .6s}
@keyframes shake{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1deg)}}
.vol{position:absolute;top:33%;height:32%;background:none;border:2px solid var(--gold);border-radius:14px;box-shadow:0 0 14px var(--gold);animation:glow 2.4s ease-in-out infinite;color:transparent}
.vol:hover{background:#ffe9a833;transform:translateY(-6px)}
@keyframes glow{0%,100%{opacity:.25;box-shadow:0 0 4px var(--gold)}50%{opacity:1;box-shadow:0 0 22px 4px var(--gold)}}
.vol i{position:absolute;top:-12px;right:-8px;background:#e0455f;color:#fff;border-radius:99px;font:700 .8rem sans-serif;padding:1px 7px}
/* letters grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;touch-action:pan-y}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;aspect-ratio:1402/1122;border-radius:12px;background:url(assets/Envelope.png) center/cover;border:2px solid var(--gold);animation:glow 2.6s infinite;overflow:hidden}
.tile.read{animation:none;border-color:#fff5;filter:saturate(.7)}
.tile span{position:absolute;bottom:4px;left:0;right:0;text-align:center;background:#0009;font-size:.9rem}
.tile.empty{background:#fff1;border:2px dashed #fff4;animation:none;display:grid;place-items:center;opacity:.6}
.pager{display:flex;justify-content:center;align-items:center;gap:.6rem;margin:1rem 0}
.dot{width:12px;height:12px;border-radius:50%;background:#fff4;border:0;padding:0}.dot.on{background:var(--gold)}
/* opening */
.ov{position:fixed;inset:0;background:#000c;z-index:50;display:grid;place-items:center;overflow:auto;padding:1rem}
.env{position:relative;width:min(92vw,640px);aspect-ratio:1402/1122}
.env>img{width:100%;height:100%;transition:opacity .9s,transform .9s}
.env.broken>img{opacity:0;transform:scale(1.12)}
.seal{position:absolute;left:36.5%;top:41.5%;width:27%;height:33%;border-radius:50%;background:none;border:0;animation:glow 1.6s infinite;box-shadow:0 0 24px 6px var(--gold)}
.env.broken .seal{display:none}
.hint{position:absolute;bottom:-2rem;width:100%;text-align:center}
.pet{position:absolute;left:50%;top:58%;width:14px;height:14px;border-radius:50% 0 50% 50%;animation:fly 1.6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.th{position:absolute;top:50%;height:8%;width:37%;background:repeating-linear-gradient(90deg,#c9a46a,#a98350 6px);border-radius:4px}
.th.l{left:2%;animation:snapL 1s forwards}.th.r{right:2%;animation:snapR 1s forwards}
@keyframes snapL{to{transform:translate(-90px,60px) rotate(-30deg);opacity:0}}
@keyframes snapR{to{transform:translate(90px,60px) rotate(30deg);opacity:0}}
.card{position:relative;width:min(94vw,660px);aspect-ratio:1478/1060;background-size:100% 100%;color:#3a2230;padding:12% 12%;overflow:auto;animation:rise 1s both;text-align:center;border-radius:6px;font-family:Caveat,cursive;font-size:clamp(1.1rem,3vw,1.6rem);line-height:1.35}
@keyframes rise{from{transform:translateY(60px) scale(.8);opacity:0}}
.card img{max-width:70%;max-height:140px;border-radius:8px;margin:.3rem}
.card .x{position:absolute;top:8px;right:12px;background:none;border:0;font-size:1.5rem;color:inherit}
.stk{font-size:1.8rem}
.row{display:grid;gap:.8rem;grid-template-columns:1fr 1fr 1fr}
.pick{display:flex;gap:.6rem}.pick label{flex:1;text-align:center;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer}
.pick input{display:none}.pick img{width:100%;display:block}.pick input:checked+img{outline:3px solid var(--gold)}
.emo button{font-size:1.5rem;background:none;border:0}
.item{display:flex;justify-content:space-between;gap:.6rem;align-items:center;border-bottom:1px solid #fff2;padding:.5rem 0;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body data-t="rose"><div id="app"></div>
<script src="letters.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const THEMES=['rose','lavender','sage','midnight','warm'];
const S=window.SETTINGS,L=window.LETTERS;
let vol=null,page=0,unlocked=false,read={};
try{read=JSON.parse(localStorage.read||'{}')}catch(e){}
document.title=S.siteTitle;document.body.dataset.t=localStorage.theme||'rose';
const isRead=l=>read[l.vol+'-'+l.slot];
function gate(){app.innerHTML='<div class="panel auth"><h1>'+esc(S.siteTitle)+'</h1><p>Enter the passcode</p><input id=pc type=password><button class=btn id=go>Open</button></div>';
 $('#go').onclick=()=>{if($('#pc').value===S.passcode){sessionStorage.ok=1;render()}else{$('#pc').value='';$('#pc').placeholder='Try again'}}}
function render(){
 if(S.passcode&&!sessionStorage.ok)return gate();
 const unread=L.filter(l=>!isRead(l)).length;
 app.innerHTML='<header><h1>\u{1F48C} '+esc(S.siteTitle)+'</h1><select id=th style="width:auto">'+THEMES.map(t=>'<option '+(document.body.dataset.t==t?'selected':'')+'>'+t+'</option>').join('')+'</select><span>'+(unread?unread+' unread':'All read')+'</span></header><main id=m></main>';
 $('#th').onchange=e=>{document.body.dataset.t=localStorage.theme=e.target.value};
 const m=$('#m');
 if(vol===null){
  if(!unlocked){m.innerHTML='<p style="text-align:center">Tap the key to open the box.</p><div class=scene id=sc><img src="assets/Box.png" alt="Box"><button class=keyhint id=ky>\u{1F5DD}\uFE0F</button></div>';
   $('#ky').onclick=()=>{$('#sc').classList.add('unlock');setTimeout(()=>{unlocked=true;render()},700)};return}
  const X=[13,28.5,43,57,70.5],W=[16,15,13.5,14,15.5];
  m.innerHTML='<p style="text-align:center">Choose a volume.</p><div class=scene><img src="assets/Open_Box.png" alt="Open box">'+X.map((x,i)=>{const n=L.filter(l=>l.vol==i+1&&!isRead(l)).length;return '<button class=vol data-v='+(i+1)+' style="left:'+x+'%;width:'+W[i]+'%;animation-delay:'+(i*.45)+'s">Volume '+(i+1)+(n?'<i>'+n+'</i>':'')+'</button>'}).join('')+'</div>';
  document.querySelectorAll('.vol').forEach(b=>b.onclick=()=>{vol=+b.dataset.v;page=0;render()});return}
 const tiles=[0,1,2,3].map(i=>{const slot=page*4+i+1,l=L.find(x=>x.vol==vol&&x.slot==slot);
  return l?'<button class="tile '+(isRead(l)?'read':'')+'" data-s='+slot+'><span>'+esc(l.title)+'</span></button>':'<div class="tile empty">Letter '+slot+'<br>not written yet</div>'}).join('');
 m.innerHTML='<button class="btn ghost" id=bk>\u2190 Back to box</button><h2>Volume '+vol+' \u00b7 page '+(page+1)+' of 5</h2><div class=grid id=gr>'+tiles+'</div><div class=pager><button class=btn id=pv>\u2039</button>'+[0,1,2,3,4].map(i=>'<button class="dot '+(i==page?'on':'')+'" data-p='+i+'></button>').join('')+'<button class=btn id=nx>\u203a</button></div>';
 $('#bk').onclick=()=>{vol=null;render()};
 const go=p=>{page=Math.max(0,Math.min(4,p));render()};
 $('#pv').onclick=()=>go(page-1);$('#nx').onclick=()=>go(page+1);
 document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.p));
 let sx;const g=$('#gr');g.ontouchstart=e=>sx=e.touches[0].clientX;g.ontouchend=e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(page+(d<0?1:-1))};
 document.querySelectorAll('.tile[data-s]').forEach(t=>t.onclick=()=>openLetter(L.find(l=>l.vol==vol&&l.slot==+t.dataset.s)))}
function img(u){return u&&/^(https:\/\/|assets\/)/.test(u)?'<img src="'+esc(u)+'" alt="">':''}
function openLetter(l){
 const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML='<div class=env id=ev><img src="assets/Envelope.png" alt="Sealed letter"><button class=seal aria-label="Break the seal"></button><div class=hint>Tap the seal to break it</div></div>';
 document.body.append(ov);
 ov.querySelector('.seal').onclick=()=>{
  const ev=ov.querySelector('#ev');ev.classList.add('broken');
  ev.insertAdjacentHTML('beforeend','<div class="th l"></div><div class="th r"></div>');
  const cols=['#ffb3c6','#c9a7f0','#fff','#f7a8d0'];
  for(let i=0;i<45;i++){const p=document.createElement('i');p.className='pet';const a=Math.random()*6.28,r=120+Math.random()*260;
   p.style.cssText='--x:'+Math.cos(a)*r+'px;--y:'+(Math.sin(a)*r-60)+'px;--r:'+Math.random()*720+'deg;background:'+cols[i%4];ev.append(p)}
  read[l.vol+'-'+l.slot]=1;localStorage.read=JSON.stringify(read);
  setTimeout(()=>{const c={pink:'Pink',purple:'Purple',white:'White'}[l.card]||'White';
   ov.innerHTML='<div class=card style="background-image:url(assets/'+c+'_Card.png)"><button class=x>\u2715</button><div style="white-space:pre-wrap">'+esc(l.text)+'</div><div class=stk>'+(l.stickers||[]).map(esc).join(' ')+'</div>'+img(l.photo)+img(l.gif)+'<div>\u2014 '+esc(S.from)+'</div></div>';
   ov.querySelector('.x').onclick=()=>{ov.remove();render()}},1500)}}
render();
</script></body></html>
